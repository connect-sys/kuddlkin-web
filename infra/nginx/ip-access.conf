# IP-based access (no domain yet). Two portals on two ports:
#   http://<VM_IP>/       → customer (Next.js on 127.0.0.1:3000)
#   http://<VM_IP>:8080/  → partner  (static Vite build)
# Backend API is reached directly at http://<VM_IP>:5000 (PM2), firewall-opened.

# ── Customer portal (port 80) ────────────────────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 25m;
    access_log /var/log/nginx/customer.access.log;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

# ── Partner / admin / service-worker portal (port 8080) ──────────────────────
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root  /var/www/kuddlkin/apps/partner/dist;
    index index.html;
    access_log /var/log/nginx/partner.access.log;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
