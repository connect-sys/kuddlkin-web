# kuddlkin.co + www.kuddlkin.co  →  Next.js customer app (PM2 "kuddl-customer") on 127.0.0.1:3000
# Certbot adds the :443 listener + certs and can 80→443 redirect.
server {
    listen 80;
    listen [::]:80;
    server_name kuddlkin.co www.kuddlkin.co;

    access_log /var/log/nginx/customer.access.log;
    error_log  /var/log/nginx/customer.error.log;

    # Long-cache Next's immutable build assets.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
