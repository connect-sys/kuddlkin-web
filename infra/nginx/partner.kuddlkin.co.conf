# partner.kuddlkin.co  →  static Vite SPA (also hosts /admin/* and /worker/* routes)
# Served straight off disk; no app process. Certbot adds :443.
server {
    listen 80;
    listen [::]:80;
    server_name partner.kuddlkin.co;

    root  /var/www/kuddlkin/apps/partner/dist;
    index index.html;

    access_log /var/log/nginx/partner.access.log;
    error_log  /var/log/nginx/partner.error.log;

    # Hashed Vite bundles — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every unknown path renders index.html (React Router handles it).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
