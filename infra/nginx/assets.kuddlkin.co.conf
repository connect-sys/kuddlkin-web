# assets.kuddlkin.co  →  reverse-proxy to the public GCS bucket.
# This lets you serve GCS objects under your own HTTPS domain WITHOUT a GCP
# load balancer. Objects must be publicly readable (create-gcs.sh sets that up),
# or switch this to signed URLs from the backend.
#
# Replace kuddlkin-prod below if your GCS_BUCKET differs.
server {
    listen 80;
    listen [::]:80;
    server_name assets.kuddlkin.co;

    access_log /var/log/nginx/assets.access.log;
    error_log  /var/log/nginx/assets.error.log;

    # Resolver needed because proxy_pass uses a variable host (Google IPs rotate).
    resolver 8.8.8.8 1.1.1.1 valid=300s;

    location / {
        set $gcs storage.googleapis.com;
        proxy_pass https://$gcs/kuddlkin-prod$uri;

        proxy_set_header Host $gcs;
        proxy_ssl_server_name on;

        # Strip Google's auth/debug headers from the response.
        proxy_hide_header x-goog-hash;
        proxy_hide_header x-goog-generation;
        proxy_hide_header x-goog-metageneration;
        proxy_hide_header x-goog-stored-content-encoding;
        proxy_hide_header x-goog-stored-content-length;
        proxy_hide_header alt-svc;

        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
