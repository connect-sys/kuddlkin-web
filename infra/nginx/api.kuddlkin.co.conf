# api.kuddlkin.co  →  Node backend (PM2 process "kuddl-backend") on 127.0.0.1:5000
# Certbot rewrites/duplicates this block to add the :443 listener + certs.
server {
    listen 80;
    listen [::]:80;
    server_name api.kuddlkin.co;

    # Uploads: KYC docs / images. Backend also guards size, but cap at the edge.
    client_max_body_size 25m;

    access_log /var/log/nginx/api.access.log;
    error_log  /var/log/nginx/api.error.log;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade (socketService.js is not wired today, but harmless).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5000/health;
        access_log off;
    }
}
