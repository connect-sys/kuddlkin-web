  # ===== METADATA / REPORTS =====
  /{objectCode}/metadata:
    get:
      tags: [Reports]
      summary: Get field metadata for an object type
      description: |
        Returns all available fields, references, and collections for the
        specified object type code (e.g., PROJ, TASK, OPTASK, USER, DOCU).
      security:
        - SessionID: []
        - ApiKey: []
      parameters:
        - name: objectCode
          in: path
          required: true
          schema:
            type: string
            example: "project"
        - $ref: '#/components/parameters/SessionIDQuery'
      responses:
        '200':
          description: Metadata for the object type
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      name:
                        type: string
                      label:
                        type: string
                      objCode:
                        type: string
                      fields:
                        type: object
                        additionalProperties:
                          type: object
                      references:
                        type: object
                        additionalProperties:
                          type: object
                      collections:
                        type: object
                        additionalProperties:
                          type: object
                      operations:
                        type: array
                        items:
                          type: string
